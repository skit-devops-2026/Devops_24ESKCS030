<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EventHive - Register</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at top, #1e293b 0%, #0f172a 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .reg-card {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.08);
      max-width: 500px;
      width: 100%;
      overflow: hidden;
    }
    .form-control, .form-select {
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      padding: 0.625rem 0.85rem;
      font-size: 0.95rem;
      transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
    }
    .form-control:focus, .form-select:focus {
      border-color: #0d6efd;
      box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.15);
    }
    .btn-primary {
      border-radius: 8px;
      padding: 0.65rem 1rem;
      font-weight: 600;
      letter-spacing: 0.01em;
      transition: all 0.2s ease;
    }
    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(13, 110, 253, 0.3);
    }
  </style>
</head>
<body>
  <div class="reg-card">
    <div class="bg-primary text-white text-center p-4">
      <h3 class="fw-bold mb-1"><i class="bi bi-person-plus me-2"></i>Create Account</h3>
      <small class="text-white-50">EventHive Student & Club Onboarding</small>
    </div>
    <div class="p-4 p-md-5">
      <form id="regForm">
        <div class="mb-3">
          <label class="form-label fw-semibold">Register As</label>
          <select class="form-select" id="rRole" required>
            <option value="student">Student</option>
            <option value="club">Club Organizer</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Full Name / Club Name</label>
          <input type="text" class="form-control" id="rName" placeholder="e.g. Alice Sharma or Tech Club" required>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">College Email</label>
          <input type="email" class="form-control" id="rEmail" placeholder="student@college.edu" required>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Roll Number / Club Code</label>
          <input type="text" class="form-control" id="rId" placeholder="e.g. 24ESKCS030" required>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Branch / Domain</label>
          <select class="form-select" id="rDomain" required>
            <option value="CSE">CSE</option>
            <option value="IT">IT</option>
            <option value="ECE">ECE</option>
            <option value="MECH">MECH</option>
            <option value="CIVIL">CIVIL</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Password</label>
          <input type="password" class="form-control" id="rPass" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary w-100 fw-semibold mb-3">Register</button>
        <div class="text-center small text-muted">Already have an account? <a href="login.html" class="text-primary text-decoration-none fw-semibold">Back to Login</a></div>
      </form>
    </div>
  </div>

  <script>
    document.getElementById('regForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            role: document.getElementById('rRole').value,
            name: document.getElementById('rName').value,
            email: document.getElementById('rEmail').value.trim().toLowerCase(),
            uniqueId: document.getElementById('rId').value,
            domain: document.getElementById('rDomain').value,
            password: document.getElementById('rPass').value
          })
        });
        const data = await res.json();
        if (!res.ok) return alert('❌ ' + data.error);
        alert('✅ Registration Successful! Please sign in.');
        window.location.replace('login.html');
      } catch (err) {
        alert('Server error. Check MongoDB connection.');
      }
    });
  </script>
</body>
</html>
